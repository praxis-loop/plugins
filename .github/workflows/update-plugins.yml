name: Update external plugins

on:
  workflow_dispatch:
  schedule:
    - cron: "29 3 * * *"

permissions:
  contents: write

jobs:
  update-plugins:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Update external plugins
        run: node tools/pluginctl update --all

      - name: Validate repository
        run: |
          npm test
          node tools/pluginctl check
          bash scripts/doctor.sh

      - name: Render update summary
        run: npm run update-summary >> "$GITHUB_STEP_SUMMARY"

      - name: Commit and push updates
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No plugin updates to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(plugins): update external plugins"
          git push
